<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Valentina</title>
<meta name="theme-color" content="#0d0614">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%97%3C/text%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=DM+Serif+Display:ital@0;1&family=Outfit:wght@400;500;600&display=swap">
<style>
:root {
  --night: #0d0614;
  --plum: #27112f;
  --rose: #ff5c8d;
  --peach: #ffb18a;
  --gold: #ffd17a;
  --ink: #fff0ec;
  --mute: #d8bcd2;
  --line: rgba(255, 240, 236, .16);
  --paper: #fdeff1;
  --paper-ink: #3b1534;
  --berry: #b3245a;
  --display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --body: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand: "Caveat", "Segoe Script", "Bradley Hand", cursive;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: var(--night); }
body { color: var(--ink); font: 400 17px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Escenario */
#stage {
  position: fixed; inset: 0; overflow: hidden;
  background:
    radial-gradient(ellipse 60% 50% at 50% 50%, rgba(255, 92, 141, .16) 0%, transparent 70%),
    radial-gradient(ellipse at 50% 50%, #3a1642 0%, #1c0a26 55%, var(--night) 100%);
}
#stage::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 50%, transparent 52%, rgba(8, 2, 14, .6) 100%);
}
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#stage canvas:active { cursor: grabbing; }
#stage canvas.pick { cursor: pointer; }

.hint, .count {
  position: absolute; left: 50%; z-index: 2; transform: translateX(-50%);
  width: max-content; max-width: calc(100vw - 32px);
  padding: 10px 18px; border-radius: 999px; text-align: center; pointer-events: none;
  border: 1px solid rgba(255, 240, 236, .16);
  background: rgba(21, 10, 28, .55);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.hint {
  top: max(16px, env(safe-area-inset-top, 0px));
  font-size: .86rem; line-height: 1.4; color: var(--mute);
  transition: opacity 1.2s ease;
}
.count {
  bottom: max(18px, env(safe-area-inset-bottom, 0px));
  font-size: .86rem; font-weight: 500; letter-spacing: .02em; color: var(--ink);
  font-variant-numeric: tabular-nums; overflow: hidden;
  background:
    linear-gradient(90deg, rgba(255, 92, 141, .42) calc(var(--p, 0) * 100%), transparent 0),
    rgba(21, 10, 28, .55);
}
.count:empty { display: none; }

/* Lector de cartas */
.reader { position: fixed; inset: 0; z-index: 40; }
.reader-bg { position: absolute; inset: 0; background: rgba(13, 5, 18, .8); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.reader-wrap {
  position: relative; height: 100%; overflow-y: auto; display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.stack { display: grid; width: min(100%, 540px); }
.stack > * { grid-area: 1 / 1; }

.env { display: none; place-self: center; position: relative; width: min(78vw, 280px); aspect-ratio: 280 / 184; perspective: 700px; pointer-events: none; z-index: 2; }
.reader.play .env { display: block; animation: envLife 1.5s ease both; }
.env i { position: absolute; display: block; }
.env-back { inset: 0; background: #e8527f; border-radius: 10px; box-shadow: 0 30px 50px -20px rgba(0, 0, 0, .7); }
.env-paper { left: 9%; right: 9%; top: 8%; bottom: 10%; background: #fff0ec; border-radius: 4px; }
.reader.play .env-paper { animation: peek .45s .5s ease both; }
.env-front { inset: 0; background: #ff6f97; border-radius: 10px; clip-path: polygon(0 0, 50% 54%, 100% 0, 100% 100%, 0 100%); }
.env-flap { left: 0; right: 0; top: 0; height: 54%; background: #ff86a9; clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top center; z-index: 3; }
.reader.play .env-flap { animation: flapOpen .5s .15s ease both; }
.env-seal { left: 50%; top: 54%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: var(--gold); z-index: 4; }
.reader.play .env-seal { animation: sealOff .2s .1s ease both; }
@keyframes flapOpen { 0% { transform: rotateX(0); z-index: 3; } 50% { z-index: 3; } 51% { z-index: 0; } 100% { transform: rotateX(-180deg); z-index: 0; } }
@keyframes sealOff { to { opacity: 0; transform: scale(.4); } }
@keyframes peek { to { transform: translateY(-36%); } }
@keyframes envLife { 0%, 62% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.82) translateY(16px); } }
@keyframes sheetIn { from { opacity: 0; transform: translateY(26px) scale(.95); } to { opacity: 1; transform: none; } }
@keyframes swapIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.sheet {
  position: relative; place-self: center; width: 100%;
  display: grid; justify-items: center; gap: 14px; text-align: center;
  color: var(--paper-ink);
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .2 0 0 0 0 .3 0 0 0 .1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
    radial-gradient(ellipse 90% 60% at 50% 0%, #fff9fa 0%, transparent 70%),
    linear-gradient(180deg, var(--paper), #f7dce3);
  border-radius: 6px 28px 6px 28px;
  padding: clamp(26px, 6vw, 46px) clamp(22px, 6vw, 48px) clamp(22px, 5vw, 34px);
  box-shadow: 0 40px 70px -30px rgba(0, 0, 0, .85), 0 0 60px -10px rgba(255, 92, 141, .25);
}
.sheet::after {
  content: ""; position: absolute; inset: 10px; pointer-events: none;
  border: 1px dashed rgba(179, 36, 90, .28); border-radius: 3px 22px 3px 22px;
}
.reader.play .sheet { animation: sheetIn .55s .9s ease both; }
.seal {
  display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%;
  font-size: 1.1rem; line-height: 1; color: #ffe3ec;
  background: radial-gradient(circle at 35% 30%, #ff7a9f, #c2255c 70%);
  box-shadow: 0 4px 10px rgba(120, 10, 50, .4), inset 0 -3px 5px rgba(90, 0, 30, .35);
}
.rnum { font: italic 400 1.02rem/1.2 var(--display); color: var(--berry); font-variant-numeric: tabular-nums; }
.rtext { font: 500 clamp(2rem, 6vw, 2.9rem)/1.12 var(--hand); text-wrap: balance; max-width: 22ch; }
.rtext.empty { font: italic 400 1.15rem/1.4 var(--display); color: rgba(59, 21, 52, .5); }
.rfrom { font: 600 clamp(1.6rem, 4.5vw, 2rem)/1 var(--hand); color: var(--berry); }
.rfrom:empty { display: none; }
.rtext.swap { animation: swapIn .35s ease both; }
.dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; margin-top: 6px; }
.dots i {
  display: block; width: 8px; height: 8px; border-radius: 50%;
  border: 1.5px solid rgba(179, 36, 90, .45); transition: transform .2s ease, background .2s ease;
}
.dots i.on { background: rgba(179, 36, 90, .55); border-color: transparent; }
.dots i.cur { background: var(--berry); border-color: transparent; transform: scale(1.5); }
.rctl { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 6px; }

.btn, .icon {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 46px; border-radius: 999px; border: 1px solid rgba(59, 21, 52, .28);
  background: transparent; color: var(--paper-ink); font-weight: 500;
  transition: transform .15s ease, background .15s ease, border-color .15s ease;
}
.icon { width: 46px; padding: 0; }
.icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn { padding: 0 24px; }
.btn.primary { margin-left: auto; background: var(--berry); border-color: var(--berry); color: #fff4f7; font-weight: 600; }
.btn:hover, .icon:hover { border-color: var(--berry); transform: translateY(-1px); }
.btn.primary:hover { background: #c92a68; }
.sheet :focus-visible { outline-color: var(--berry); }

.rfrom::after { content: " \2665"; font-size: .6em; vertical-align: .25em; }
.splash {
  position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 24px; text-align: center;
  background: radial-gradient(ellipse 70% 55% at 50% 45%, #4a1a4e 0%, #1c0a26 60%, var(--night) 100%);
  transition: opacity .9s ease, visibility .9s;
}
.splash.out { opacity: 0; visibility: hidden; }
.splash-in { display: grid; justify-items: center; gap: 20px; max-width: 420px; }
.splash svg { width: 74px; height: 68px; filter: drop-shadow(0 0 18px rgba(255, 92, 141, .75)); animation: beat 1.5s ease-in-out infinite; }
@keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.14); } 30% { transform: scale(1); } 45% { transform: scale(1.08); } }
.splash h1 { margin: 0; font: italic 400 clamp(2.7rem, 12vw, 4.6rem)/1 var(--display); text-wrap: balance; text-shadow: 0 0 34px rgba(255, 92, 141, .55); }
.splash p { color: var(--mute); font-size: 1.05rem; }
.splash .btn { margin-top: 8px; min-height: 52px; padding: 0 32px; font-size: 1.05rem; font-weight: 600; color: #2a0c1d; background: var(--rose); border-color: var(--rose); box-shadow: 0 10px 30px -8px rgba(255, 92, 141, .7); }
.splash .btn:hover { background: #ff7aa2; border-color: #ff7aa2; }
.splash :focus-visible { outline-color: var(--gold); }
.snd {
  position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(18px, env(safe-area-inset-bottom, 0px));
  z-index: 30; width: 46px; height: 46px; padding: 0; border-radius: 50%; display: grid; place-items: center;
  border: 1px solid rgba(255, 240, 236, .16); background: rgba(21, 10, 28, .55); color: var(--ink);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); transition: border-color .15s ease;
}
.snd:hover { border-color: var(--rose); }
.snd svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.snd .x { display: none; }
.snd.off .x { display: inline; }
.snd.off .w { display: none; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

@media (max-width: 600px) {
  .hint { font-size: .78rem; padding: 9px 14px; max-width: 340px; border-radius: 18px; }
  .count { font-size: .8rem; padding: 9px 16px; }
  .reader-wrap { padding: max(12px, env(safe-area-inset-top, 0px)) 12px max(12px, env(safe-area-inset-bottom, 0px)); }
  .stack { width: min(100%, 480px); }
  .sheet { max-height: calc(100dvh - 28px); overflow-y: auto; }
  button, .btn { min-height: 44px; }
}
@media (prefers-reduced-motion: reduce) {
  .reader.play .env { display: none; }
  .reader.play .sheet, .rtext.swap { animation: none; }
  .btn, .icon, .dots i, .splash { transition: none; }
  .splash svg { animation: none; }
}
</style>
</head>
<body>
<div class="splash" id="splash" role="dialog" aria-modal="true" aria-labelledby="sTitle">
  <div class="splash-in">
    <svg viewBox="0 0 74 68" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff86a9"/><stop offset="1" stop-color="#e0245e"/></linearGradient></defs><path d="M37 64C10 46 2 33 2 21 2 11 10 3 20 3c7 0 13 4 17 10C41 7 47 3 54 3c10 0 18 8 18 18 0 12-8 25-35 43z" fill="url(#sg)"/></svg>
    <h1 id="sTitle">Feliz cumpleaños, Valentina</h1>
    <p>Hay cartas esperándote en esta galaxia.</p>
    <button class="btn" type="button" id="go">Abrir mi regalo</button>
  </div>
</div>
<button class="snd" id="snd" type="button" aria-label="Silenciar sonido" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="w" d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/><path class="x" d="M16 9l5 6M21 9l-5 6"/></svg></button>
<main class="stage" id="stage">
  <canvas id="gal" aria-label="Galaxia en 3D con un corazón con la foto de Valentina y su nombre en el centro. Alrededor giran doce cartas."></canvas>
  <p class="hint" id="hint">Arrastra para girar. Pellizca para acercarte. Toca un sobre para abrirlo.</p>
  <p class="count" id="count" aria-live="polite"></p>
  <div class="sr" id="sr"></div>
</main>
<div class="reader" id="reader" hidden>
  <div class="reader-bg" id="readerBg"></div>
  <div class="reader-wrap" role="dialog" aria-modal="true" aria-labelledby="rNum">
    <div class="stack">
      <div class="env" aria-hidden="true">
        <i class="env-back"></i>
        <i class="env-paper"></i>
        <i class="env-front"></i>
        <i class="env-flap"></i>
        <i class="env-seal"></i>
      </div>
      <article class="sheet">
        <span class="seal" aria-hidden="true">&#9829;</span>
        <p class="rnum" id="rNum">Carta 1 de 12</p>
        <p class="rtext" id="rText"></p>
        <p class="rfrom" id="rFrom"></p>
        <div class="dots" id="rDots" aria-hidden="true"></div>
        <div class="rctl">
          <button class="icon" type="button" id="rPrev" aria-label="Carta anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
          <button class="icon" type="button" id="rNext" aria-label="Carta siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
          <button class="btn primary" type="button" id="rClose">Cerrar</button>
        </div>
      </article>
    </div>
  </div>
</div>
